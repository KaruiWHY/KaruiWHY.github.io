<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog - notes, research logs, and thoughts by WU Haoyang.">
    <meta name="keywords" content="WU Haoyang blog, research notes, markdown, LaTeX, electronic information">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://karuiwhy.github.io/blog.html">
    <title>Blog - WU Haoyang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-oA1oHhCq3RKqGZo4PMBVXsfS5aXoaZySUdkGFUTkOcJCIZy9FHn5Vf3LcdXK8rXK" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="index.html" class="header-link">WU Haoyang</a></h1>
            <nav class="site-nav">
                <a href="index.html">About</a>
                <a href="blog.html">Blog</a>
                <a href="#archive">Archive</a>
            </nav>
        </header>

        <main>
            <section class="blog">
                <h2>Blog</h2>
                <p class="blog-intro">Thoughts, notes, and progress logs on research, learning, and life.</p>
                <div id="posts">
                    <p>Loading posts…</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 WU Haoyang. All rights reserved.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-sQBNP6P8LBZ7lfHsAyYvWcN6iYG3PaY5E9O+V1YxDCEV4VpWw2X2gYdUv+kt1aBc" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQCwXTlzZQzQ0jrISFRCGDpa2BkLomPvKgJo0vvVuv5QW7HQwZ0p6PkR4dT" crossorigin="anonymous"></script>
    <script>
    // Fetch posts metadata and render them with Markdown + LaTeX support.
    async function loadPosts() {
        const container = document.getElementById('posts');
        try {
            const res = await fetch('posts/posts.json');
            if (!res.ok) throw new Error('Network response was not ok');
            const data = await res.json();
            renderPosts(container, data.posts || []);
        } catch (err) {
            console.warn('Failed to load posts:', err);
            container.innerHTML = '<p>无法加载文章（在本地直接用 file:// 打开时 fetch 可能被浏览器阻止）。\n建议用本地静态服务器（参见项目根目录的 BLOG_INSTRUCTIONS.md）。</p>';
        }
    }

    function renderMarkdown(markdownText) {
        if (!window.marked) {
            return markdownText;
        }
        try {
            if (typeof window.marked.parse === 'function') {
                return window.marked.parse(markdownText);
            }
            return window.marked(markdownText);
        } catch (e) {
            console.warn('Failed to render markdown:', e);
            return markdownText;
        }
    }

    function renderMathInArticle(element) {
        if (!window.renderMathInElement) return;
        try {
            window.renderMathInElement(element, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "\\[", right: "\\]", display: true },
                    { left: "\\(", right: "\\)", display: false }
                ],
                throwOnError: false
            });
        } catch (e) {
            console.warn('Failed to render math:', e);
        }
    }

    async function renderPosts(container, posts) {
        if (!posts.length) {
            container.innerHTML = '<p>目前还没有文章。你可以参照说明添加第一篇文章。</p>';
            return;
        }
        container.innerHTML = '';

        for (const post of posts) {
            const article = document.createElement('article');
            article.className = 'post';

            const title = document.createElement('h3');
            title.className = 'post-title';
            title.textContent = post.title;

            const meta = document.createElement('p');
            meta.className = 'post-date';
            meta.textContent = post.date || '';

            const tagsLine = document.createElement('div');
            tagsLine.className = 'post-tags';
            if (Array.isArray(post.tags)) {
                post.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'post-tag';
                    span.textContent = tag;
                    tagsLine.appendChild(span);
                });
            }

            const content = document.createElement('div');
            content.className = 'post-content';

            const readMore = document.createElement('button');
            readMore.className = 'read-more';
            readMore.type = 'button';
            readMore.textContent = 'Read more';

            const full = document.createElement('div');
            full.className = 'post-full';
            full.style.display = 'none';

            // Append static structure first
            article.appendChild(title);
            article.appendChild(meta);
            if (tagsLine.childElementCount > 0) {
                article.appendChild(tagsLine);
            }
            article.appendChild(content);
            article.appendChild(readMore);
            article.appendChild(full);
            container.appendChild(article);

            // Load Markdown content for this post
            let markdownText = '';
            if (post.mdPath) {
                try {
                    const res = await fetch(post.mdPath);
                    if (res.ok) {
                        markdownText = await res.text();
                    }
                } catch (e) {
                    console.warn('Failed to load markdown for post', post.id, e);
                }
            }

            if (!markdownText && (post.content || post.excerpt)) {
                markdownText = post.excerpt || post.content;
            }

            const html = renderMarkdown(markdownText);
            full.innerHTML = html;

            // Use first 200 chars of plain markdown as excerpt if not explicitly provided
            const excerptSource = post.excerpt || markdownText;
            if (excerptSource) {
                const short = excerptSource.length > 220 ? excerptSource.substring(0, 220) + '…' : excerptSource;
                content.textContent = short;
            } else {
                content.textContent = '';
            }

            // Initial math render only for expanded content to avoid heavy work
            readMore.addEventListener('click', () => {
                if (full.style.display === 'none') {
                    full.style.display = 'block';
                    readMore.textContent = 'Show less';
                    renderMathInArticle(full);
                } else {
                    full.style.display = 'none';
                    readMore.textContent = 'Read more';
                }
            });
        }
    }

    document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
    <script>
    // Highlight active header nav link based on current filename
    (function(){
        try{
            const links = document.querySelectorAll('.site-nav a');
            const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
            links.forEach(a => {
                const href = (a.getAttribute('href') || '').split('/').pop().toLowerCase();
                if (!href) return;
                if (href === current || (href === 'index.html' && (current === '' || current === 'index.html'))) {
                    a.classList.add('active');
                }
            });
        }catch(e){/* ignore */}
    })();
    </script>
</body>
</html>
